# QR production Nginx template.
# Place this file under /etc/nginx/conf.d/qr.conf and run `nginx -t` before reload.
#
# The application now enforces security-sensitive rules itself. Nginx keeps only
# edge controls: static files, reverse proxy headers, basic rate limits, and the
# permanently disabled init endpoint.

limit_req_zone $binary_remote_addr zone=qr_login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=qr_api_limit:10m rate=20r/s;

upstream qr_server {
    server 127.0.0.1:8888;
    keepalive 32;
}

server {
    listen 1111;
    server_name www.qq123qq.com www.q9q96.com;

    root /var/www/qr-web;
    index index.html;

    access_log /var/log/nginx/qr.access.log;
    error_log /var/log/nginx/qr.error.log;

    client_max_body_size 50m;

    location = /init {
        return 403;
    }

    location ^~ /init/ {
        return 403;
    }

    location = /api/init/checkdb {
        return 403;
    }

    location = /api/init/initdb {
        return 403;
    }

    location ~ ^/api/base/(login|captcha)$ {
        limit_req zone=qr_login_limit burst=10 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://qr_server;
    }

    location ^~ /api/ {
        limit_req zone=qr_api_limit burst=80 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://qr_server;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
