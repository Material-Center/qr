# QR production Nginx template.
# Place this file under /etc/nginx/conf.d/qr.conf and run `nginx -t` before reload.
#
# Security-sensitive rules are enforced by the application.

server {
    listen 1111;
    server_name www.qq123qq.com www.q9q96.com;

    root /var/www/qr-web;
    index index.html;

    access_log /var/log/nginx/qr.access.log;
    error_log /var/log/nginx/qr.error.log;

    client_max_body_size 50m;

    # Incident IPs.
    deny 192.253.229.139;

    location ^~ /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:8888/;
        rewrite ^/api/(.*)$ /$1 break;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
