# QR production Nginx template.
# Place this file under /etc/nginx/conf.d/qr.conf and run `nginx -t` before reload.
#
# Security-sensitive rules are enforced by the application.

# Blocked client IPs. Add incident IPs here once.
geo $qr_blocked_ip {
    default 0;
    192.253.229.139 1;
    113.194.242.182 1;
    183.222.132.151 1;
    223.160.228.135 1;
    222.139.88.196 1;
    39.144.69.208 1;
    39.144.60.81 1;
}

server {
    listen 1111;
    server_name www.qq123qq.com www.q9q96.com;

    root /var/www/qr-web;
    index index.html;

    access_log /var/log/nginx/qr.access.log;
    error_log /var/log/nginx/qr.error.log;

    client_max_body_size 50m;

    if ($qr_blocked_ip) {
        return 403;
    }

    location ^~ /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:8888/;
        rewrite ^/api/(.*)$ /$1 break;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
